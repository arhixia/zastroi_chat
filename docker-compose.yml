services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [zastroi_net]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [zastroi_net]

  migrate:
    build: .
    image: chatbot-backend
    env_file: .env
    command: alembic upgrade head
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"
    networks: [zastroi_net]

  api:
    image: chatbot-backend
    restart: unless-stopped
    env_file: .env
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/app/uploads
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2 --app-dir src
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    networks: [zastroi_net]

  worker:
    image: chatbot-backend
    restart: unless-stopped
    env_file: .env
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    volumes:
      - uploads_data:/app/uploads
    working_dir: /app/src
    command: arq app.workers.worker_settings.WorkerSettings
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    networks: [zastroi_net]

  admin-frontend:
    build:
      context: ./admin-frontend
      args:
        VITE_API_BASE_URL: ${API_HOST}
    restart: unless-stopped
    ports:
      - "5173:80"
    networks: [zastroi_net]

volumes:
  pgdata:
  redis_data:
  uploads_data:

networks:
  zastroi_net:
    driver: bridge